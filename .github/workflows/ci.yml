name: Platform CI

on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Integration adapter self-test
        run: npm run test:adapters

      - name: Learning correctness regression
        run: npm run test:learning

      - name: Learning evidence regression
        run: npm run test:evidence

      - name: Authorization boundary regression
        run: npm run test:authorization

      - name: Versioned activity contract regression
        run: npm run test:activity-contract

      - name: Durable learner progress regression
        run: npm run test:progress

      - name: Duplicate-safe learning event regression
        run: npm run test:idempotency

      - name: Classroom revision workflow regression
        run: npm run test:classroom

      - name: Evidence rubric and reporting regression
        run: npm run test:evidence-reporting

      - name: Curriculum QA regression
        run: npm run test:curriculum-qa

      - name: Device audio and PWA safety regression
        run: npm run test:device

      - name: Operational closeout regression
        run: npm run test:operations

      - name: Evidence and reporting regression
        run: npm run test:evidence-reporting

      - name: Platform AI spend-safety regression
        run: npm run test:platform-ai

      - name: Production build
        run: npm run build

      - name: Learning production HTTP regression
        run: npm run test:learning:http
