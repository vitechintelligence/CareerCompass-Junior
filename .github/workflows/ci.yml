name: LMS security and learning journey
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cc_test
      APP_ENV: development
      APP_ORIGIN: http://127.0.0.1:8000
      RATE_LIMIT_SECRET: synthetic-ci-rate-key-32-characters-minimum
      LANGSMITH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: node --check public/app.js
      - run: python -m compileall -q app.py cc_lms scripts tests
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python -m pip_audit -r requirements.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lms-validation
          path: artifacts/
