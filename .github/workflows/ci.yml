name: Platform CI

on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/operational-integration-closeout' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-remote --exit-code origin "refs/heads/${{ github.head_ref }}" >/dev/null 2>&1; then
            cp package-lock.json /tmp/package-lock.json
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
              exit 0
            fi
            cp /tmp/package-lock.json package-lock.json
            git add package-lock.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock Node dependencies for reproducible CI"
            git push origin "${{ github.head_ref }}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Integration adapter self-test
        run: npm run test:adapters

      - name: Learning correctness regression
        run: npm run test:learning

      - name: Learning evidence regression
        run: npm run test:evidence

      - name: Authorization boundary regression
        run: npm run test:authorization

      - name: Versioned activity contract regression
        run: npm run test:activity-contract

      - name: Durable learner progress regression
        run: npm run test:progress

      - name: Duplicate-safe learning event regression
        run: npm run test:idempotency

      - name: Classroom revision workflow regression
        run: npm run test:classroom

      - name: Evidence rubric and reporting regression
        run: npm run test:evidence-reporting

      - name: Curriculum QA regression
        run: npm run test:curriculum-qa

      - name: Device audio and PWA safety regression
        run: npm run test:device

      - name: Operational closeout regression
        run: npm run test:operations

      - name: Evidence and reporting regression
        run: npm run test:evidence-reporting

      - name: Platform AI spend-safety regression
        run: npm run test:platform-ai

      - name: Production build
        run: npm run build

      - name: Learning production HTTP regression
        run: npm run test:learning:http
