<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Compass Junior — Interactive Explorer</title>
<style>
:root{
  --sun:#ffb703; --sun-deep:#f28c0f;
  --sky:#3aa8e0; --sky-deep:#1d7fb8;
  --grass:#4caf6b; --grass-deep:#358a4f;
  --berry:#ef476f; --berry-deep:#c93257;
  --grape:#8a63d2; --grape-deep:#6b46b8;
  --ink:#233045; --muted:#6b7688;
  --cream:#fffaf0; --paper:#ffffff; --line:#f0e4cc;
  --r-sm:12px; --r-md:18px; --r-lg:26px;
  --shadow:0 10px 26px -12px rgba(35,48,69,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand-text b,.mascot-name{font-family:'Baloo 2','Comic Sans MS','Segoe UI Rounded','Arial Rounded MT Bold',-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--sun);color:#fff}
a{color:inherit}

#app{display:flex;flex-direction:column;min-height:100vh}
header.topbar{
  background:linear-gradient(135deg,var(--sky),var(--sky-deep));
  color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:40;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:8px;border:none;background:none;color:#fff;padding:0}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-text b{font-size:1rem}
.brand-text span{font-size:.62rem;color:#dff3ff;font-weight:600}
.topbar-spacer{flex:1}
.stat-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 10px;font-size:.72rem;font-weight:700;color:#fff}
.xp-wrap{display:flex;align-items:center;gap:6px}
.xp-bar{width:56px;height:7px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.xp-bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .4s}
.icon-btn-hdr{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:7px 9px;font-size:.9rem}
.menu-btn{display:none}

.shell{display:flex;flex:1;min-height:0}
nav.sidenav{width:280px;flex-shrink:0;background:#fff;border-right:2px solid var(--line);padding:14px 12px 80px;overflow-y:auto}
nav.sidenav::-webkit-scrollbar{width:8px}
nav.sidenav::-webkit-scrollbar-thumb{background:#e6dcc2;border-radius:8px}
.unit-btn{width:100%;text-align:left;background:#fbf6e8;border:2px solid transparent;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:.82rem;margin-bottom:8px;font-weight:700;color:var(--ink)}
.unit-btn.active{border-color:var(--sun);background:#fff3d9}
.unit-num-badge{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff}
.unit-btn-title small{display:block;color:var(--muted);font-weight:600;font-size:.66rem;margin-top:1px}
.unit-progress{margin-left:auto;font-size:.68rem;font-weight:800;color:var(--grass-deep)}

.backdrop{display:none;position:fixed;inset:0;background:rgba(20,25,40,.5);z-index:35}

main.content{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 90px}
.wrap{max-width:840px;margin:0 auto}

/* mascot */
.mascot-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mascot-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--berry));display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;box-shadow:var(--shadow);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.mascot-bubble{background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px 14px;font-size:.85rem;font-weight:700;color:var(--ink);position:relative;max-width:520px}

/* home */
.hero{background:linear-gradient(135deg,var(--sky) 0%,var(--grape) 100%);color:#fff;border-radius:var(--r-lg);padding:30px 28px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:1.9rem;margin:0 0 6px}
.hero p{margin:0 0 16px;color:#eef6ff;font-size:.95rem;max-width:480px}
.hero .cta{background:var(--sun);color:#5a3800;border:none;border-radius:14px;padding:12px 20px;font-weight:800;font-size:.92rem;box-shadow:0 8px 18px -6px rgba(0,0,0,.3)}
.hero .compass-mark{position:absolute;right:-20px;top:-20px;opacity:.18}

.section-label{font-size:.76rem;font-weight:800;color:var(--sky-deep);letter-spacing:.02em;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:2px;background:var(--line);border-radius:2px}

.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.unit-card{background:#fff;border:2px solid var(--line);border-radius:var(--r-md);padding:16px;cursor:pointer;transition:transform .15s}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.unit-card .badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin-bottom:8px}
.unit-card h3{margin:0 0 3px;font-size:.98rem}
.unit-card p{margin:0 0 8px;color:var(--muted);font-size:.78rem}
.unit-card .prog-track{height:7px;border-radius:999px;background:#f0e9d6;overflow:hidden}
.unit-card .prog-track i{display:block;height:100%;border-radius:999px}
.unit-card .prog-label{font-size:.68rem;color:var(--muted);margin-top:4px;font-weight:700}

/* unit view */
.unit-hero{background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px}
.unit-hero .eyebrow{font-size:.72rem;font-weight:800;color:var(--sky-deep)}
.unit-hero h2{margin:4px 0 8px;font-size:1.5rem}
.unit-hero p{margin:0;color:var(--muted);font-size:.9rem}
.unit-meta-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.unit-meta{background:var(--cream);border-radius:12px;padding:9px 13px;font-size:.78rem;font-weight:700}
.unit-meta b{display:block;font-size:.66rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.lesson-path{display:flex;flex-direction:column;gap:8px}
.lesson-row{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.lesson-row:hover{border-color:var(--sky)}
.lesson-row .num{width:32px;height:32px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;flex-shrink:0}
.lesson-row.done .num{background:var(--grass)}
.lesson-row .titles{flex:1}
.lesson-row .titles b{display:block;font-size:.88rem}
.lesson-row .titles span{color:var(--muted);font-size:.76rem}
.lesson-row .stickers{font-size:.9rem}

/* lesson view */
.crumb{font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.lesson-head h2{margin:0 0 4px;font-size:1.5rem}
.lesson-head p{margin:0 0 18px;color:var(--muted);font-size:.92rem}

.panel{background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:18px}
.panel h4{margin:0 0 12px;font-size:.78rem;letter-spacing:.02em;font-weight:800;display:flex;align-items:center;gap:8px}
.panel.tint-sun{background:#fff8e6}
.panel.tint-sky{background:#eaf6fd}
.panel.tint-grass{background:#eef8ef}
.panel.tint-berry{background:#fdeef2}

.vocab-grid{display:flex;flex-wrap:wrap;gap:10px}
.vocab-card{flex:1;min-width:130px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
.vocab-card .en{font-weight:800;font-size:1.05rem;color:var(--ink)}
.vocab-card .vn{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.icon-row{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{border:none;border-radius:9px;padding:7px 10px;font-size:.74rem;display:flex;align-items:center;gap:5px;font-weight:800;color:#fff}
.icon-btn.speak{background:var(--sky)}
.icon-btn.rec{background:var(--berry)}
.icon-btn.rec.recording{background:#a5223f;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
audio.playback{width:100%;height:30px;margin-top:8px;display:none}
audio.playback.show{display:block}

.model-turn{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.model-turn .who{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff}
.model-turn.compa .who{background:var(--grape)}
.model-turn.you .who{background:var(--berry)}
.model-bubble{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;flex:1}
.model-turn.you .model-bubble{background:#fff0f4;border-color:#fbd3dd}
.model-bubble .en{font-weight:800;font-size:1rem;margin-bottom:2px}
.model-bubble .vn{font-size:.82rem;color:var(--muted);margin-bottom:8px}

.pair-row{display:flex;gap:14px;flex-wrap:wrap}
.pair-card{flex:1;min-width:150px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.pair-card .w{font-weight:800;font-size:1.05rem}
.pair-card .v{font-size:.78rem;color:var(--muted);margin-bottom:8px}

.try-text{font-size:.9rem;line-height:1.5;margin:0 0 12px}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice-btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:.86rem;font-weight:700}
.choice-btn.ok{background:var(--grass);color:#fff;border-color:var(--grass)}
.choice-btn.no{background:#fdeeea;color:var(--berry-deep);border-color:var(--berry)}
.done-btn{border:2px solid var(--grass);background:#fff;color:var(--grass-deep);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.86rem}
.done-btn.on{background:var(--grass);color:#fff}

.mission-box{background:#fff;border:2px dashed #d9c98a;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.mission-box p{margin:0 0 4px;font-size:.9rem;line-height:1.5}
.practice-example{font-size:.86rem;color:var(--muted);margin:10px 0 8px}
.blank-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.blank-input{border:2px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:.88rem;flex:1;min-width:120px}
.blank-preview{font-weight:800;font-size:.98rem;color:var(--ink);background:#fff8e6;border-radius:10px;padding:9px 12px;margin-bottom:10px}

.checkrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.stamp-btn{flex:1;min-width:110px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 10px;text-align:center;font-weight:800;font-size:.82rem}
.stamp-btn .ic{font-size:1.5rem;display:block;margin-bottom:4px}
.stamp-btn.on{background:var(--grass);border-color:var(--grass);color:#fff}
.reflect-input{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:.85rem;margin-top:10px}

.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.nav-btn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:800;font-size:.86rem}
.nav-btn.primary{background:var(--sky);color:#fff;border-color:var(--sky)}
.nav-btn:disabled{opacity:.35}

/* badges overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:60;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.overlay-card{background:#fff;border-radius:var(--r-lg);max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:22px}
.overlay-card h3{margin:0 0 4px}
.overlay-card .close-x{float:right;background:none;border:none;font-size:1.2rem;color:var(--muted)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.badge-card{background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.badge-card.locked{opacity:.4;filter:grayscale(1)}
.badge-card .ic{font-size:1.8rem;display:block;margin-bottom:4px}
.badge-card b{display:block;font-size:.76rem}
.badge-card span{font-size:.66rem;color:var(--muted)}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-40px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;font-size:.9rem;z-index:80;opacity:0;transition:all .35s;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.confetti-piece{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;border-radius:2px}

@media (max-width:900px){
  nav.sidenav{position:fixed;left:0;top:0;bottom:0;z-index:36;transform:translateX(-104%);transition:transform .25s;width:270px}
  nav.sidenav.open{transform:translateX(0)}
  .backdrop.open{display:block}
  .menu-btn{display:inline-flex}
  main.content{padding:16px 14px 80px}
  .hero{padding:22px 18px}
  .hero h1{font-size:1.5rem}
  .stat-pill span.wide-only{display:none}
}

/* Natural voice controls */
.voice-tools{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:5px 7px;color:#fff}
.voice-tools .voice-icon{font-size:.9rem}
.voice-tools select{max-width:150px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;padding:5px 7px;font:600 .72rem/1.2 inherit;outline:none}
.voice-tools select option{color:#16233b;background:#fff}
.voice-tools .voice-status{font-size:.65rem;color:rgba(255,255,255,.72);white-space:nowrap}
@media(max-width:900px){.voice-tools .voice-picker,.voice-tools .voice-status{display:none}.voice-tools select{max-width:118px}}
@media(max-width:640px){.voice-tools{padding:4px 5px}.voice-tools .voice-icon{display:none}.voice-tools select{max-width:105px;font-size:.68rem}}

</style>
<!-- CCJ_OBJECTIVE_ACTIVITIES -->
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="menu-btn icon-btn-hdr" id="menuBtn">☰</button>
    <button class="brand" id="brandBtn">
      <span style="font-size:1.5rem">🧭</span>
      <span class="brand-text"><b>Career Compass Junior</b><span>Beginner · 7–12 tuổi</span></span>
    </button>

    <div class="voice-tools" title="English listening voice settings">
      <span class="voice-icon" aria-hidden="true">🎧</span>
      <select id="voiceMode" aria-label="Listening speed">
        <option value="conversation">Natural conversation</option>
        <option value="practice">Slow practice</option>
      </select>
      <select class="voice-picker" id="voicePicker" aria-label="English voice">
        <option value="">Best available voice</option>
      </select>
      <span class="voice-status" id="voiceStatus">Loading voice…</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="stat-pill">🔥 <span id="streakLabel">0</span></div>
    <div class="stat-pill xp-wrap">⭐ Lv<span id="levelLabel">1</span> <span class="xp-bar"><i id="xpBar" style="width:0%"></i></span></div>
    <button class="icon-btn-hdr" id="badgesBtn">🏅</button>
  </header>

  <div class="shell">
    <div class="backdrop" id="backdrop"></div>
    <nav class="sidenav" id="sidenav"></nav>
    <main class="content"><div class="wrap" id="content"></div></main>
  </div>
</div>

<div class="overlay" id="badgesOverlay">
  <div class="overlay-card">
    <button class="close-x" id="closeBadges">✕</button>
    <h3>🏅 Huy hiệu của em</h3>
    <p style="color:var(--muted);font-size:.85rem;margin:0">Hoàn thành nhiệm vụ để mở khoá huy hiệu mới!</p>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>
</div>

<script>
const LESSONS = JSON.parse(document.getElementById('lessons-data').textContent);
const UNITS = JSON.parse(document.getElementById('units-data').textContent);
const UNIT_COLORS = ['#3aa8e0','#4caf6b','#ffb703','#ef476f','#8a63d2','#1d7fb8','#358a4f','#f28c0f','#c93257','#6b46b8','#3aa8e0','#4caf6b'];
function unitColor(u){ return UNIT_COLORS[(u-1)%UNIT_COLORS.length]; }
function lessonsOf(u){ return LESSONS.filter(l=>l.unit===u).sort((a,b)=>a.lesson-b.lesson); }

const MASCOT_LINES = {
  home: ["Chào em! Mình là Compa, la bàn nhỏ của em! 🧭","Sẵn sàng khám phá bài học hôm nay chưa?","Hôm nay mình học gì nhỉ?"],

  star5: ["Xuất sắc! Em giỏi quá! 🌟","Tuyệt đỉnh! Cho em 5 sao!","Wow! Hoàn thành xuất sắc!"],

};
function mascotSay(context){
  const arr = MASCOT_LINES[context] || MASCOT_LINES.lesson;
  return arr[Math.floor(Math.random()*arr.length)];
}

/* ---------- storage ---------- */
const STORE_KEY = 'ccjunior_v1';
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let store = loadStore();
function setVal(id,val){ store[id]=val; saveStore(store); }
function getVal(id,def){ return store[id]!==undefined?store[id]:def; }

function lid(n){ return 'l'+n; }
function recordedSet(){ return new Set(getVal('recorded',[])); }
function markRecorded(id){
  const s = recordedSet(); s.add(id); setVal('recorded', Array.from(s));
}
function starsFor(n){ return getVal(lid(n)+'_stamps',[]).length; }
function stampsFor(n){ return getVal(lid(n)+'_stamps',[]); }
function toggleStamp(n, key){
  const arr = new Set(stampsFor(n));
  if(arr.has(key)) arr.delete(key); else arr.add(key);
  setVal(lid(n)+'_stamps', Array.from(arr));
}

/* ---------- XP / level / streak ---------- */
function computeXP(){
  let xp = 0;
  LESSONS.forEach(l=> xp += stampsFor(l.lesson).length*5 );
  xp += recordedSet().size*2;
  xp += earnedBadges().length*15;
  return xp;
}
function computeLevel(xp){ return 1+Math.floor(xp/80); }
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  const last = getVal('lastVisit', null);
  let streak = getVal('streak',0);
  if(last !== today){
    if(last){
      const d1 = new Date(last), d2 = new Date(today);
      const diffDays = Math.round((d2-d1)/86400000);
      streak = diffDays===1 ? streak+1 : 1;
    } else { streak = 1; }
    setVal('lastVisit', today); setVal('streak', streak);
  }
  return streak;
}
function updateHeaderStats(){
  const xp = computeXP(); const lvl = computeLevel(xp);
  const into = xp - (lvl-1)*80; const pct = Math.min(100, Math.round(into/80*100));
  document.getElementById('levelLabel').textContent = lvl;
  document.getElementById('xpBar').style.width = pct+'%';
  document.getElementById('streakLabel').textContent = getVal('streak',0);
}

let actx;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq, start, dur, gainVal){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.value = gainVal||0.06;
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur);
}

/* ============================= AUDIO: NATURAL ENGLISH VOICE ============================= */
// English listening is intentionally English-only. We prefer pre-generated natural audio
// when deployed, then the best neural/natural device voice available in the browser.
const AUDIO_PREF_KEY = 'ccjunior_audio_pref_v2';
let _voicesReadyPromise = null;
let _audioPrefs = (()=>{
  try { return JSON.parse(localStorage.getItem(AUDIO_PREF_KEY)) || {}; } catch(e) { return {}; }
})();
function saveAudioPrefs(){ try{ localStorage.setItem(AUDIO_PREF_KEY, JSON.stringify(_audioPrefs)); }catch(e){} }
function loadVoices(){
  if(_voicesReadyPromise) return _voicesReadyPromise;
  _voicesReadyPromise = new Promise(resolve=>{
    if(!('speechSynthesis' in window)){ resolve([]); return; }
    const existing = window.speechSynthesis.getVoices();
    if(existing && existing.length){ resolve(existing); return; }
    let done = false;
    const finish = ()=>{ if(done) return; done = true; resolve(window.speechSynthesis.getVoices()); };
    window.speechSynthesis.onvoiceschanged = finish;
    setTimeout(finish, 1000);
  });
  return _voicesReadyPromise;
}
loadVoices();
const VOICE_RANK = [/natural/i, /neural/i, /online/i, /wavenet/i, /premium/i, /enhanced/i, /studio/i,
  /google us english/i, /microsoft.*(aria|jenny|guy|ava|emma)/i, /samantha/i, /matthew/i, /zira/i];
function englishVoices(voices){
  return voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'))
    .sort((a,b)=>{
      const score=v=>VOICE_RANK.reduce((best,re,i)=>re.test(v.name)?Math.max(best,VOICE_RANK.length-i):best,0)+(v.localService?0:.25);
      return score(b)-score(a) || a.name.localeCompare(b.name);
    });
}
async function bestVoice(lang){
  const voices = await loadVoices();
  const candidates = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith((lang||'en').slice(0,2).toLowerCase()));
  const selected = _audioPrefs.voiceURI;
  if(selected){
    const exact = candidates.find(v=>v.voiceURI===selected || v.name===selected);
    if(exact) return exact;
  }
  let best=null, bestScore=-1;
  candidates.forEach(v=>{
    let score=0;
    VOICE_RANK.forEach((re,i)=>{ if(re.test(v.name)) score=Math.max(score,VOICE_RANK.length-i); });
    if(v.lang.toLowerCase()===(lang||'en-US').toLowerCase()) score+=.5;
    if(score>bestScore){ bestScore=score; best=v; }
  });
  return best || candidates[0] || null;
}
function voiceMode(){ return _audioPrefs.mode === 'practice' ? 'practice' : 'conversation'; }
function voiceRate(){ return voiceMode()==='practice' ? 0.82 : 0.97; }
function voicePitch(){ return voiceMode()==='practice' ? 1.0 : 1.02; }

/* ---------- Optional pre-generated studio/natural audio ---------- */
let _audioManifest = null;
let _audioManifestPromise = fetch('./audio/manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
_audioManifestPromise.then(m=>{ _audioManifest=m||{}; updateVoiceStatus(); });
let _sharedAudioEl = null;
function playPreGenerated(text){
  if(!_audioManifest) return false;
  const file = _audioManifest[text];
  if(!file) return false;
  if(!_sharedAudioEl) _sharedAudioEl = new Audio();
  _sharedAudioEl.pause();
  _sharedAudioEl.src = './audio/' + file;
  _sharedAudioEl.currentTime = 0;
  _sharedAudioEl.playbackRate = voiceMode()==='practice' ? .86 : 1;
  _sharedAudioEl.play().catch(()=>{});
  return true;
}

async function speak(text, lang){
  lang = lang || 'en-US';
  if(lang.startsWith('en')){
    if(_audioManifest===null) await _audioManifestPromise;
    if(playPreGenerated(text)) return;
  }
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = voiceRate();
    u.pitch = voicePitch();
    const v = await bestVoice(lang);
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
async function updateVoiceStatus(){
  const status=document.getElementById('voiceStatus');
  if(!status) return;
  const studio = _audioManifest && Object.keys(_audioManifest).length>0;
  if(studio){ status.textContent = voiceMode()==='practice' ? 'Studio · practice' : 'Studio audio'; return; }
  const v=await bestVoice('en-US');
  status.textContent = v ? (voiceMode()==='practice' ? 'Slow · '+v.name : v.name) : 'Browser voice';
}
async function initVoiceControls(){
  const mode=document.getElementById('voiceMode');
  const picker=document.getElementById('voicePicker');
  if(!mode || !picker) return;
  mode.value=voiceMode();
  const voices=englishVoices(await loadVoices());
  voices.slice(0,18).forEach(v=>{
    const opt=document.createElement('option');
    opt.value=v.voiceURI || v.name;
    opt.textContent=v.name+' · '+v.lang;
    picker.appendChild(opt);
  });
  if(_audioPrefs.voiceURI && [...picker.options].some(o=>o.value===_audioPrefs.voiceURI)) picker.value=_audioPrefs.voiceURI;
  mode.onchange=()=>{ _audioPrefs.mode=mode.value; saveAudioPrefs(); updateVoiceStatus(); };
  picker.onchange=()=>{ _audioPrefs.voiceURI=picker.value; saveAudioPrefs(); updateVoiceStatus(); };
  await updateVoiceStatus();
}

/* ---------- recording ---------- */
let activeRecorder=null, activeChunks=[];
async function toggleRecord(btnEl, audioEl, recId){
  if(btnEl.classList.contains('recording')){
    if(activeRecorder && activeRecorder.state!=='inactive') activeRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('Trình duyệt này không hỗ trợ ghi âm.'); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    activeChunks = [];
    const rec = new MediaRecorder(stream);
    activeRecorder = rec;
    rec.ondataavailable = e=>{ if(e.data.size>0) activeChunks.push(e.data); };
    rec.onstop = ()=>{
      const blob = new Blob(activeChunks, {type:'audio/webm'});
      audioEl.src = URL.createObjectURL(blob);
      audioEl.classList.add('show');
      btnEl.classList.remove('recording');
      btnEl.textContent = '🎙 Ghi lại';
      stream.getTracks().forEach(t=>t.stop());
      markRecorded(recId);
      playDing();
      showToast(mascotSay('record'));
      updateHeaderStats();
      checkNewBadges();
    };
    rec.start();
    btnEl.classList.add('recording');
    btnEl.textContent = '⏹ Dừng lại';
  }catch(err){
    alert('Không thể mở micro. Hãy cho phép quyền micro nhé!');
  }
}

    <div class="panel"><h4>🎉 SELF-CHECK</h4>${selfCheckHtml(l)}</div>
    <div class="lesson-nav">
      <button class="nav-btn" id="prevBtn" ${prev?'':'disabled'}>← Bài trước</button>
      <button class="nav-btn primary" id="nextBtn">${next?'Bài tiếp theo →':'Hoàn thành! 🎉'}</button>
    </div>
  `;
  wireCommon(c, l);
  document.getElementById('prevBtn').onclick = ()=>{ if(prev) go('u'+prev.unit+'l'+prev.lesson); };
  document.getElementById('nextBtn').onclick = ()=>{ if(next) go('u'+next.unit+'l'+next.lesson); else go('u'+l.unit); };
}

function selfCheckHtml(l){
  const stamps = new Set(stampsFor(l.lesson));
  const items = [
    {key:'tried', ic:'💪', en:'I tried', vn:'Em đã thử'},
    {key:'listened', ic:'👂', en:'I listened', vn:'Em đã lắng nghe'},
    {key:'shared', ic:'🗣️', en:'I shared', vn:'Em đã chia sẻ'},
  ];
  const reflect = getVal(lid(l.lesson)+'_reflect','');
  return `<div class="checkrow">${items.map(it=>`
    <button class="stamp-btn ${stamps.has(it.key)?'on':''}" data-stamp="${it.key}"><span class="ic">${it.ic}</span>${it.en}<br><small>${it.vn}</small></button>
  `).join('')}</div>
  <input class="reflect-input" placeholder="Một điều em muốn thử lại… / One thing to try again…" data-store="${lid(l.lesson)}_reflect" value="${reflect.replace(/"/g,'&quot;')}">`;
}

function wireCommon(c, l){
  c.querySelectorAll('[data-speak]').forEach(b=> b.onclick = ()=> speak(b.dataset.speak, b.dataset.lang));
  c.querySelectorAll('[data-rec]').forEach(b=>{
    const audioEl = document.getElementById(b.dataset.rec);
    b.onclick = ()=> toggleRecord(b, audioEl, b.dataset.recid);
  });
  c.querySelectorAll('[data-store]').forEach(el=> el.addEventListener('input', ()=> setVal(el.dataset.store, el.value)));
  c.querySelectorAll('[data-stamp]').forEach(b=>{
    b.onclick = ()=>{
      toggleStamp(l.lesson, b.dataset.stamp);
      const nowDone = lessonDone(l.lesson);
      renderLesson(l.lesson);
      updateHeaderStats();
      if(nowDone){ confettiBurst(); playChime(); showToast(mascotSay('star5')); }
      checkNewBadges();
      renderSidenav();
    };
  });
}

function renderLesson(n){
  const l = LESSONS.find(x=>x.lesson===n);
  if(!l) return;
  if(l.special==='assessment'){ renderAssessment(l); return; }
  const c = document.getElementById('content');
  const {prev,next} = renderLessonNav(n);

  c.innerHTML = `
    <div class="crumb">🧭 Unit ${l.unit} · Lesson ${l.lesson}/96</div>
    <div class="lesson-head"><h2>${l.titleEn}</h2><p>${l.titleVn}</p></div>
    ${mascotBar('lesson')}

    <div class="panel tint-sky">
      <h4>👀 LOOK, LISTEN &amp; SAY / NHÌN, NGHE VÀ NÓI</h4>
      <div class="vocab-grid">${vocabHtml(l)}</div>
    </div>

    <div class="panel tint-sun">
      <h4>🎭 SPEAKING MODEL — ROLE PLAY VỚI COMPA</h4>
      ${modelHtml(l)}
    </div>

    <div class="panel">
      <h4>🎶 SOUND &amp; RHYTHM / NGHE ÂM VÀ NHỊP</h4>
      <div class="pair-row">
        ${l.soundEn.split('•').map((w,i)=>{
          const vnPart = (l.soundVn.split('•')[i]||'').trim();
          const rid = 'sr_'+l.lesson+'_'+i;
          return `<div class="pair-card"><div class="w">${w.trim()}</div><div class="v">${vnPart}</div>
            <div class="icon-row" style="justify-content:center">
              <button class="icon-btn speak" data-speak="${w.trim().replace(/"/g,'&quot;')}" data-lang="en-US">🔊</button>
              <button class="icon-btn rec" data-rec="aud_${rid}" data-recid="${rid}">🎙</button>
            </div>
            <audio class="playback" id="aud_${rid}" controls></audio>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="panel tint-grass">
      <h4>⚡ A QUICK TRY / THỬ MỘT CHÚT NHÉ</h4>
      ${quickTryHtml(l)}
    </div>

    <div class="panel tint-berry">
      <h4>🎯 MY MINI MISSION / NHIỆM VỤ NHỎ CỦA EM</h4>
      <div class="mission-box">
        <p><b>${l.missionVn}</b></p>
        <p style="color:var(--muted)">${l.missionEn}</p>
      </div>
      <div class="practice-example">Example: <b>${l.practiceEn}</b><br>Ví dụ: ${l.practiceVn}</div>
      <div id="blankPreview" class="blank-preview">${l.practiceBlank}</div>
      <div class="blank-row">
        <input class="blank-input" id="blankInput" placeholder="Điền từ của em…">
        <button class="icon-btn rec" data-rec="aud_mission_${l.lesson}" data-recid="mission_${l.lesson}">🎙 Ghi câu của em</button>
      </div>
      <audio class="playback" id="aud_mission_${l.lesson}" controls></audio>
    </div>

    <div class="panel">
      <h4>🎉 CREATE &amp; SHARE / SÁNG TẠO VÀ CHIA SẺ</h4>
      <p class="try-text">Dùng tranh để nói với bạn. Lắng nghe, rồi đổi vai. <br><span style="color:var(--muted)">Use your picture to tell a partner. Listen, then swap roles.</span></p>
      ${selfCheckHtml(l)}
    </div>

    <div class="lesson-nav">
      <button class="nav-btn" id="prevBtn" ${prev?'':'disabled'}>← Bài trước</button>
      <button class="nav-btn primary" id="nextBtn">${next?'Bài tiếp theo →':'Hoàn thành! 🎉'}</button>
    </div>
  `;

  wireCommon(c, l);
  const blankInput = document.getElementById('blankInput');
  const blankPreview = document.getElementById('blankPreview');
  if(blankInput){
    blankInput.addEventListener('input', ()=>{
      blankPreview.textContent = l.practiceBlank.replace('__________', blankInput.value || '__________');
    });
  }
  const qtBtn = document.getElementById('qtDone');
  if(qtBtn){
    qtBtn.onclick = ()=>{
      const now = !getVal(lid(l.lesson)+'_qt', false);
      setVal(lid(l.lesson)+'_qt', now);
      qtBtn.classList.toggle('on', now);
      qtBtn.textContent = now?'✓ Đã thử!':'Mình đã thử! ✅';
      if(now){ playDing(); }
    };
  }
  wireObjectiveChoices(c, l);
  document.getElementById('prevBtn').onclick = ()=>{ if(prev) go('u'+prev.unit+'l'+prev.lesson); };
  document.getElementById('nextBtn').onclick = ()=>{ if(next) go('u'+next.unit+'l'+next.lesson); else go('u'+l.unit); };

  window.scrollTo(0,0);
}

function wireObjectiveChoices(c, l){
  const activity = objectiveForLesson(l);
  if(!activity) return;
  const buttons = Array.from(c.querySelectorAll('[data-choice]'));
  const feedback = c.querySelector('#objectiveFeedback');
  let pending = false;
  buttons.forEach(button=>{
    button.onclick = async ()=>{
      if(pending) return;
      pending = true;
      buttons.forEach(b=>{ b.disabled=true; b.classList.remove('ok','no'); });
      feedback.textContent='Đang kiểm tra… / Checking…';
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(),12000);
      try {
        const submissionId = crypto.randomUUID();
        const response = await fetch('/api/learning/evaluate', {
          method:'POST', headers:{'Content-Type':'application/json'}, signal:controller.signal,
          body:JSON.stringify({activityId:activity.activityId,activityVersion:activity.activityVersion,selectedAnswerId:button.dataset.choice,submissionId})
        });
        const data = await response.json();
        const result = data.evaluation;
        if(!response.ok || !result || result.activityId!==activity.activityId ||
           result.activityVersion!==activity.activityVersion || result.submissionId!==submissionId ||
           result.selectedAnswerId!==button.dataset.choice ||
           !['correct','incorrect'].includes(result.outcome) ||
           (result.outcome==='correct' && result.criterionMet!==true)) throw new Error('invalid_evaluation');
        if(!button.isConnected) return;
        const correct = result.outcome==='correct';
        button.classList.add(correct?'ok':'no');
        feedback.textContent=result.feedback.vi+' / '+result.feedback.en;
        if(correct) playDing();
      } catch(e){
        if(button.isConnected) feedback.textContent='Chưa kiểm tra được — thử lại khi có mạng. / Check failed — retry when connected.';
      } finally {
        clearTimeout(timeout);
        pending=false;
        buttons.forEach(b=>{ b.disabled=false; });
      }
    };
  });
}

/* ---------- MAIN RENDER ---------- */
function render(){
  const route = location.hash.replace('#','')||'home';
  renderSidenav();
  updateHeaderStats();
  if(route==='home'){ renderHome(); return; }
  let m = route.match(/^u(\d+)l(\d+)$/);
  if(m){ renderLesson(parseInt(m[2],10)); return; }
  m = route.match(/^u(\d+)$/);
  if(m){ renderUnit(parseInt(m[1],10)); return; }
  renderHome();
}
touchStreak();
render();
checkNewBadges();
</script>
